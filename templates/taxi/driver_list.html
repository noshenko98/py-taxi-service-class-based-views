{% extends "base.html" %}

{% block title %}<title>Drivers</title>{% endblock %}

{% block content %}
  <h1>Car list</h1>
  {% for driver in driver_list %}
    <ul>
      <li><a href={% url "taxi:driver-detail" pk=driver.id %}>{{ driver.first_name }} {{ driver.last_name }}</a></li>
    </ul>
  {% endfor %}
{% endblock %}
